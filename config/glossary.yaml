# Curated glossary — grows over time. Each entry matches the artifact's proven
# format: term, IPA, a spoken respelling, definition, and "why it matters to you".
# enrich.py scans item titles/bodies for these (case-insensitive whole-word) and
# links matches; app.js renders them as tap-to-open glossary sheets with TTS.
istqb:
  term: ISTQB
  ipa: "/ˌaɪ.ɛs.tiː.kjuː.biː/"
  respelling: "eye-ess-tee-kyoo-bee"
  lang: en-GB
  definition: >
    The International Software Testing Qualifications Board — the body behind
    the most widely recognized software-testing certification scheme.
  why_it_matters: >
    An ISTQB cert is the credential recruiters filter on most often in QA/test
    automation postings — worth tracking news from the board directly.
mcdc:
  term: MC/DC
  ipa: "/ˌɛm.siːˌdiːˈsiː/"
  respelling: "em-see-dee-see"
  lang: en-GB
  definition: >
    Modified Condition/Decision Coverage — a strict test-coverage criterion
    requiring every condition in a compound boolean to be shown, on its own,
    to change the outcome.
  why_it_matters: >
    ISO 26262 requires it at higher safety levels — a term worth recognizing
    instantly in automotive/embedded QA postings.
csms:
  term: CSMS
  ipa: "/ˌsiːɛsɛmˈɛs/"
  respelling: "see-ess-em-ess"
  lang: en-GB
  definition: >
    Cyber Security Management System — the certified process UNECE R155
    requires carmakers to run across a vehicle's whole life.
  why_it_matters: >
    Regulatory floor under automotive security testing — demand for these
    skills is written into law, not fashion.
