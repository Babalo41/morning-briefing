<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning Briefing</title>
<meta name="description" content="A personal daily briefing, rebuilt automatically.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FCFCFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Briefing">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-top">
      <span class="mark"></span>
      <h1>Morning Briefing</h1>
      <span class="stamp" id="stamp"></span>
      <button class="iconbtn" id="lockBtn" aria-pressed="false" aria-label="Unlock personal data" hidden>
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <button class="iconbtn" id="searchBtn" aria-pressed="false" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="search" id="searchWrap">
      <input id="q" type="search" placeholder="Search every edition, term and story…" autocomplete="off">
    </div>
    <nav class="tabs" role="tablist" id="tabsTop"></nav>
  </header>

  <div class="panel on" id="p-today" role="tabpanel"></div>
  <div class="panel" id="p-learn" role="tabpanel"></div>
  <div class="panel" id="p-saved" role="tabpanel"></div>
  <div class="panel" id="p-archive" role="tabpanel"></div>
  <div class="panel" id="p-glossary" role="tabpanel"></div>
  <div class="panel" id="p-interests" role="tabpanel"></div>

  <p class="foot">
    Updated automatically, on its own schedule — you don't need to ask.
    Tap any story to open it, the star to keep it, and any dotted word to hear it said aloud.
    Stars and read marks stay on this device.
  </p>
</div>

<nav class="nav" id="tabsBot"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
  <div class="sh-in" id="sheetIn"></div></div>
<div class="tip" id="tip"></div>

<div class="stories" id="stories" aria-hidden="true">
  <div class="st-top">
    <div class="st-segs" id="stSegs"></div>
    <div class="st-head">
      <span class="st-sec" id="stSec"></span>
      <span class="st-cnt" id="stCnt"></span>
      <button class="st-x sctrl" data-act="stclose" aria-label="Close stories">✕</button>
    </div>
  </div>
  <div class="st-stage" id="stStage">
    <div class="st-card" id="stCard"></div>
  </div>
</div>

<!-- data.local.js is gitignored, local-only, never in this repo on GitHub —
     the 404 on the public site is expected and harmless (see
     TAGGED_INTERESTS_ARCHITECTURE.md "Phase 7"). When it exists (written by
     run_pipeline.py for local use) it silently overrides EDITION_DATA with
     an unlocked version of today's edition. -->
<script src="data.js"></script>
<script src="data.local.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
